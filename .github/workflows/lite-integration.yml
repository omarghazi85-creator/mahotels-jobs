name: Isolated Lite WordPress integration
on:
  pull_request:
    branches: [fix/safe-netlify-jobs-20261116, fix/lite-legacy-reference-20261121]
    paths:
      - 'wordpress/mahotels-jobs-lite/**'
      - 'tests/lite-integration.php'
      - '.github/workflows/lite-integration.yml'
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-password
          MYSQL_DATABASE: isolated_wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l wordpress/mahotels-jobs-lite/mahotels-jobs-lite.php && php -l wordpress/mahotels-jobs-lite/draft-bridge.php && php -l tests/lite-integration.php
      - name: Prepare disposable WordPress
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          mkdir /tmp/isolated-wp
          cd /tmp/isolated-wp
          php /tmp/wp-cli.phar core download --quiet
          php /tmp/wp-cli.phar config create --dbname=isolated_wp --dbuser=root --dbpass=isolated-test-password --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant
          php /tmp/wp-cli.phar core install --url=http://example.test --title=Test --admin_user=fixture_admin --admin_password=fixture-password --admin_email=fixture@example.test --skip-email
          cp -R "$GITHUB_WORKSPACE/wordpress/mahotels-jobs-lite" wp-content/plugins/
          php /tmp/wp-cli.phar plugin activate mahotels-jobs-lite
      - name: Run isolated integration
        run: cd /tmp/isolated-wp && php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/lite-integration.php"
      - name: Verify application-password authentication over local HTTP
        run: |
          cd /tmp/isolated-wp
          php /tmp/wp-cli.phar option update home http://127.0.0.1:8888
          php /tmp/wp-cli.phar option update siteurl http://127.0.0.1:8888
          test_app_password="$(php /tmp/wp-cli.phar user application-password create fixture_admin fixture-check --porcelain)"
          php -S 127.0.0.1:8888 index.php >/tmp/isolated-wp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do curl -s -o /dev/null http://127.0.0.1:8888/ && break; sleep 1; done
          data='{"source":"marriott","original_id":"TEST-123","source_url":"https://careers.marriott.com/job/TEST-123"}'
          auth_status="$(curl -sS -o /tmp/authorized.json -w '%{http_code}' -u "fixture_admin:$test_app_password" -H 'Content-Type: application/json' -d "$data" 'http://127.0.0.1:8888/?rest_route=/mahotels-jobs/v1/source-exists')"
          test "$auth_status" = 200
          php -r '$r=json_decode(file_get_contents("/tmp/authorized.json"), true); if ($r !== ["exists"=>false]) exit(1);'
          anon_status="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$data" 'http://127.0.0.1:8888/?rest_route=/mahotels-jobs/v1/source-exists')"
          test "$anon_status" = 401
          test_term="$(php /tmp/wp-cli.phar term list ma_job_country --slug=test-country --field=term_id)"
          php -r '$t=(int)$argv[1];echo json_encode(["title"=>"Test draft","status"=>"draft","slug"=>"ma-jobs-".str_repeat("c",32),"content"=>"<p>Fixture</p>","ma_job_country"=>[$t]]);' "$test_term" > /tmp/draft-create.json
          create_status="$(curl -sS -o /tmp/draft-created.json -w '%{http_code}' -u "fixture_admin:$test_app_password" -H 'Content-Type: application/json' --data-binary @/tmp/draft-create.json 'http://127.0.0.1:8888/?rest_route=/wp/v2/ma_hotel_job')"
          test "$create_status" = 201
          test_post_id="$(php -r '$r=json_decode(file_get_contents("/tmp/draft-created.json"),true); if (($r["status"]??"")!=="draft" || empty($r["id"])) exit(1); echo (int)$r["id"];')"
          test_fields='{"source":"marriott","original_id":"TEST-123","source_url":"https://careers.marriott.com/job/TEST-123?ref=A%2BB&x=2","company":"Fixture","city":"Riyadh","role":"Test role","posted_on":"2026-10-04"}'
          fields_status="$(curl -sS -o /tmp/draft-fields.json -w '%{http_code}' -u "fixture_admin:$test_app_password" -H 'Content-Type: application/json' -d "$test_fields" "http://127.0.0.1:8888/?rest_route=/mahotels-jobs/v1/draft-fields/$test_post_id")"
          test "$fields_status" = 200
          read_status="$(curl -sS -o /tmp/draft-read.json -w '%{http_code}' -u "fixture_admin:$test_app_password" "http://127.0.0.1:8888/?rest_route=/mahotels-jobs/v1/draft-fields/$test_post_id")"
          test "$read_status" = 200
          php -r '$r=json_decode(file_get_contents("/tmp/draft-read.json"),true); $f=$r["fields"]??[]; if (($r["status"]??"")!=="draft" || ($f["source_url"]??"")!=="https://careers.marriott.com/job/TEST-123?ref=A%2BB&x=2" || ($f["ar_ready"]??"")!=="0" || ($f["verified_on"]??"")!=="") exit(1);'
